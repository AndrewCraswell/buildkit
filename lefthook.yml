pre-commit:
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      exclude:
        - "**/src/vendor/**"
      run: node node_modules/oxlint/bin/oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,md,yml,yaml}"
      exclude:
        - "**/src/vendor/**"
      # Lockfiles and API reports match the glob but oxfmt ignores them, so a commit of only those has nothing to format.
      run: node node_modules/oxfmt/bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
pre-push:
  commands:
    types:
      run: pnpm check:types
