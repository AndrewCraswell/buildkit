name: Publish Buildkit website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify packages and API baselines
        run: pnpm verify
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the website for its configured URL
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          pnpm --filter @buildkitgg/site build
          pnpm --filter @buildkitgg/docs build
      - name: Assemble website and interactive documentation
        run: |
          cp -r apps/behavior-storybook/storybook-static apps/site/dist/storybook
          cp -r apps/docs/dist/site apps/site/dist/docs
          touch apps/site/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@v4
