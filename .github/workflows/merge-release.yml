name: Merge verified release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["codex/release-*", "codex/shadcn-update-*"]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: merge-release
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name ==
      github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the verified pipeline PR and start main workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Read GitHub metadata only. Never check out or execute PR code here.
          number=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number,isDraft,author,headRefOid,isCrossRepository --jq \
            '.[] | select(.isDraft == false and .isCrossRepository == false and .author.login == "app/github-actions") | .number')
          test -n "$number" || exit 0
          test "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" = "$VERIFIED_SHA" || exit 0
          # GitHub still enforces every branch protection and the current head SHA.
          gh pr merge "$number" --squash --match-head-commit "$VERIFIED_SHA"
          # GITHUB_TOKEN merges do not trigger push workflows automatically.
          gh workflow run ci.yml --ref main
          gh workflow run pages.yml --ref main
