name: Release changed packages
on:
  workflow_call:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare or publish changed packages at verified main
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$VERIFIED_SHA" || exit 0
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {existsSync,readFileSync,readdirSync} from 'node:fs';
          if (existsSync('change') && readdirSync('change').some(name => name.endsWith('.json'))) {
            execFileSync('gh', ['workflow','run','prepare-release.yml','--ref','main'], {stdio:'inherit'});
            process.exit(0);
          }
          const files = execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD', '--', 'packages/*/*/package.json'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const changed = files.some(file => {
            if (!existsSync(file)) return false;
            const pkg = JSON.parse(readFileSync(file, 'utf8'));
            if (pkg.private || !pkg.name.startsWith('@buildkitgg/')) return false;
            let before;
            try { before = JSON.parse(execFileSync('git', ['show', `HEAD^:${file}`], {encoding:'utf8',stdio:['ignore','pipe','ignore']})); } catch { return true; }
            return before.version !== pkg.version;
          });
          if (changed) execFileSync('gh', ['workflow','run','publish.yml','--ref','main','-f','package=*','-f','dry_run=false'], {stdio:'inherit'});
          NODE
