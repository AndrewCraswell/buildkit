name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec beachball bump
      - run: pnpm install
      - run: pnpm format
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No pending release changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="codex/release-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add --all
          git commit -m 'chore: prepare package releases'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'chore: prepare package releases' --body 'Beachball version and changelog updates. This release PR merges automatically after required CI checks pass. Packages publish automatically after main CI succeeds.'
          gh workflow run ci.yml --ref "$branch"
