name: Update shadcn styles
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch upstream and regenerate all styles
        run: |
          pnpm update:shadcn
          pnpm generate
          pnpm format
      - name: Detect upstream updates
        id: changes
        run: |
          if test -n "$(git status --porcelain)"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check public APIs without accepting new baselines
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check:api
      - name: Prepare compatible patch releases
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm exec node packages/tooling/shadcn-generator/src/release.mjs
          pnpm exec beachball bump
          pnpm install
          pnpm format
          pnpm install --frozen-lockfile
      - name: Validate release artifacts and npm aliases
        if: steps.changes.outputs.changed == 'true'
        run: pnpm validate
      - name: Open update pull request
        if: always() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="codex/shadcn-update-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add --all
          git commit -m 'chore: update generated shadcn styles'
          gh auth setup-git
          git push origin "$branch"
          printf '%s\n' "Upstream shadcn update. Validation result: $RESULT." '' 'This pipeline PR merges automatically after required CI checks pass. API baselines are never accepted automatically. Failed updates need repair and release preparation before merging. Packages publish automatically after main CI succeeds.' > "$RUNNER_TEMP/shadcn-pr.md"
          gh pr create --base main --head "$branch" --title 'chore: update generated shadcn styles' --body-file "$RUNNER_TEMP/shadcn-pr.md"
          gh workflow run ci.yml --ref "$branch"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shadcn-api-and-consumer-diagnostics
          path: |
            dist/api-report-temp/
            dist/style-consumers/*/dist/
          if-no-files-found: ignore
