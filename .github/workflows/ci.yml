name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release notes for public package changes
        if:
          github.event_name == 'pull_request' && !(github.event.pull_request.user.login == 'github-actions[bot]' &&
          startsWith(github.head_ref, 'codex/release-'))
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: pnpm check:change --branch "origin/$BASE_BRANCH"
      - name: Verify code, public API baselines, and builds
        run: pnpm verify
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildkitgg/dev-domains test:integration
