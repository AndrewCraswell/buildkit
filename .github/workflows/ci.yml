name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@8b4311a69b28ad7423898dceda366cee6644f92c # v1.1.1
    with:
      # The release notes check diffs a pull request against its base branch, so it needs the whole history.
      fetch-depth: 0
      command: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          BASE_BRANCH="$GITHUB_BASE_REF" pnpm --filter @repo/api-tools release:check
        fi
        pnpm validate
  # Branch protection and merge-release.yml expect a check named verify, and a reusable workflow's checks are named after
  # the calling job, such as "ci-verify / Verify (ubuntu-latest)". This job reports ci-verify's result as verify.
  verify:
    needs: ci-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ci-verify to pass
        env:
          RESULT: ${{ needs.ci-verify.result }}
        run: test "$RESULT" = success
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@8b4311a69b28ad7423898dceda366cee6644f92c # v1.1.1
      - run: pnpm --filter @buildkitgg/dev-domains test:integration
      - run: pnpm --filter @buildkitgg/scaffolder test:integration
      - run: pnpm turbo run build --filter=@buildkitgg/cli^...
      - run: pnpm --filter @buildkitgg/cli test:integration
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@8b4311a69b28ad7423898dceda366cee6644f92c # v1.1.1
      - name: Test the Drizzle adapter on PostgreSQL, Neon and MySQL servers
        run: pnpm turbo run test:servers --filter=@better-apps/drizzle
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@8b4311a69b28ad7423898dceda366cee6644f92c # v1.1.1
      - run: pnpm turbo run build --filter=@buildkitgg/cli...
      - name: Generate Buildkit apps, then install, check, lint, build and type-check each one
        run: pnpm --filter @buildkitgg/cli test:smoke
  release:
    needs: [verify, integration, databases, templates]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/publish-after-ci.yml
  merge-release:
    needs: [verify, integration, databases, templates]
    if: >-
      github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/codex/release-') ||
      startsWith(github.ref, 'refs/heads/codex/shadcn-update-'))
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    # Run the reviewed implementation, never a workflow from the dispatched branch.
    uses: AndrewCraswell/buildkit/.github/workflows/merge-release.yml@6e895465fd17eff94c4ce5e071a69c921f916026
