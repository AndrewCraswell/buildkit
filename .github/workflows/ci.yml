name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release notes for public package changes
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: pnpm --filter @repo/api-tools release:check
      - name: Verify code, public API baselines, and builds
        run: pnpm validate
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildkitgg/dev-domains test:integration
      - run: pnpm --filter @buildkitgg/scaffolder test:integration
      - run: pnpm turbo run build --filter=@buildkitgg/cli^...
      - run: pnpm --filter @buildkitgg/cli test:integration
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the Drizzle adapter on PostgreSQL, Neon and MySQL servers
        run: pnpm turbo run test:servers --filter=@better-apps/drizzle
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@buildkitgg/cli...
      - name: Generate Buildkit apps, then install, check, lint, build and type-check each one
        run: pnpm --filter @buildkitgg/cli test:smoke
  release:
    needs: [verify, integration, databases, templates]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/publish-after-ci.yml
  merge-release:
    needs: [verify, integration, databases, templates]
    if: >-
      github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/codex/release-') ||
      startsWith(github.ref, 'refs/heads/codex/shadcn-update-'))
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    # Run the reviewed implementation, never a workflow from the dispatched branch.
    uses: AndrewCraswell/buildkit/.github/workflows/merge-release.yml@55ff7b58f44fada6bd3a1d3bf5b1e9d96a5307b5
